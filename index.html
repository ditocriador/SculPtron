<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SCULPTRON - GOLD CORE LOOP</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{font-family:'Orbitron',monospace}
body{background:#020205;overflow:hidden}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes spinR{to{transform:rotate(-360deg)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.ring1{animation:spin 22s linear infinite}.ring2{animation:spinR 32s linear infinite}.ring3{animation:spin 48s linear infinite}
.orb-wrap{animation:breathe 6s ease-in-out infinite}
#coreVideo{filter:brightness(1.15) contrast(1.1) saturate(1.2)}
</style>
</head>
<body class="text-white h-screen flex flex-col bg-[#020205]">
<div class="flex justify-between p-6 text-[10px] tracking-[0.4em]"><div class="text-amber-200">SCULPTRON · GOLD CORE · LOOP</div><div class="text-emerald-400">● ONLINE</div></div>
<div class="flex-1 flex flex-col items-center justify-center -mt-10">
<div class="relative w-[380px] h-[380px] flex items-center justify-center">
<div class="ring1 absolute w-[440px] h-[440px] rounded-full border border-amber-400/25" style="border-top-color:rgba(251,191,36,.6)"></div>
<div class="ring2 absolute w-[520px] h-[520px] rounded-full border border-dashed border-cyan-200/10"></div>
<div class="ring3 absolute w-[620px] h-[620px] rounded-full border border-amber-500/10"></div>
<div id="orbWrap" class="orb-wrap relative w-[280px] h-[280px] rounded-full overflow-hidden border-2 border-amber-400/40 shadow-[0_0_100px_rgba(251,191,36,0.7)] bg-black">
<video id="coreVideo" autoplay loop muted playsinline preload="auto" style="width:100%;height:100%;object-fit:cover;border-radius:50%;transform:scale(1.15)">
<source src="core.mp4" type="video/mp4">
</video>
</div>
<div id="glow" class="absolute w-[340px] h-[340px] bg-amber-500/30 blur-[60px] rounded-full -z-10"></div>
</div>
<div id="status" class="mt-12 text-[11px] tracking-[0.6em] text-amber-200/90 font-bold">STANDING BY - LOOP ATIVO</div>
<button id="talkBtn" class="mt-6 px-10 py-3.5 bg-amber-500/20 border border-amber-400/40 rounded-full text-[11px] tracking-[0.35em]">FALAR COM SCULPTRON</button>
<div id="chat" class="mt-5 w-[92%] max-w-xl max-h-32 overflow-y-auto space-y-2 hidden text-xs"></div>
<div class="mt-4 flex gap-2 w-[92%] max-w-xl"><input id="textInput" placeholder="Digite aqui Sir..." class="flex-1 bg-black/60 border border-white/10 rounded-full px-5 py-3 text-xs outline-none"><button onclick="sendText()" class="bg-amber-500/20 border border-amber-400/40 px-6 rounded-full text-xs">Enviar</button></div>
</div>
<script>
const video=document.getElementById('coreVideo');const orbWrap=document.getElementById('orbWrap');const glow=document.getElementById('glow');const st=document.getElementById('status');const chat=document.getElementById('chat');const btn=document.getElementById('talkBtn');let speaking=false,animInt;video.loop=true;video.playbackRate=0.85;let rec;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){rec=new SR();rec.lang='pt-BR';rec.onstart=()=>{st.textContent='OUVINDO...';glow.style.transform='scale(1.35)'};rec.onend=()=>{st.textContent='STANDING BY - LOOP ATIVO';glow.style.transform='scale(1)'};rec.onresult=e=>{let txt=e.results[0][0].transcript;addMsg('Você: '+txt);reply(txt);};}btn.onclick=()=>{if(!SR)return alert('Use Chrome Sir');try{rec.start()}catch{rec.stop()}};function addMsg(m){chat.classList.remove('hidden');chat.innerHTML+=`<div class='p-2.5 bg-white/[0.05] border border-white/10 rounded-lg'>${m}</div>`;chat.scrollTop=chat.scrollHeight}function reply(tt){let r=`Entendido Sir! "${tt}" - núcleo dourado em loop infinito operacional!`;addMsg('SculPtron: '+r);speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(r);u.lang='pt-BR';u.rate=0.92;u.onstart=()=>{speaking=true;st.textContent='FALANDO...';video.playbackRate=1.15;let sc=1;animInt=setInterval(()=>{if(!speaking)return;sc=1.08+Math.random()*0.14;orbWrap.style.transform=`scale(${sc})`;glow.style.transform=`scale(${sc*1.3})`},320)};u.onend=()=>{speaking=false;clearInterval(animInt);orbWrap.style.transform='scale(1)';glow.style.transform='scale(1)';video.playbackRate=0.85;st.textContent='STANDING BY - LOOP ATIVO'};speechSynthesis.speak(u);}function sendText(){let i=document.getElementById('textInput');if(!i.value.trim())return;let v=i.value;i.value='';addMsg('Você: '+v);reply(v);}document.getElementById('textInput').addEventListener('keypress',e=>{if(e.key==='Enter')sendText()});document.body.addEventListener('click',()=>{if(video.paused)video.play()},{once:true});
</script>
</body>
</html>
