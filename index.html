<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SculPtron</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Orbitron',monospace;background:#030308;overflow:hidden;margin:0}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes spinR{to{transform:rotate(-360deg)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.sphere{animation:breathe 6s ease-in-out infinite;transition:transform.6s ease}
.ring1{animation:spin 25s linear infinite}.ring2{animation:spinR 35s linear infinite}.ring3{animation:spin 50s linear infinite}
video{width:100%;height:100%;object-fit:cover;border-radius:50%}
</style>
</head>
<body class="text-white h-screen flex flex-col">
<div class="flex justify-between p-5 text-[10px] tracking-[0.5em]"><div class="text-amber-200">SCULPTRON · GOLD SYSTEM</div><div class="text-emerald-400">ONLINE</div></div>
<div class="flex-1 flex flex-col items-center justify-center">
<div class="relative w-[300px] h-[300px] flex items-center justify-center">
<div class="ring1 absolute w-[380px] h-[380px] rounded-full border border-amber-400/20"></div>
<div class="ring2 absolute w-[440px] h-[440px] rounded-full border border-cyan-300/10"></div>
<div class="ring3 absolute w-[500px] h-[500px] rounded-full border border-dashed border-amber-400/10"></div>
<div id="orb" class="sphere w-[230px] h-[230px] rounded-full overflow-hidden border border-amber-500/30 shadow-[0_0_90px_#ff9f1c80] bg-black">
<video id="coreVideo" autoplay loop muted playsinline><source src="core.mp4" type="video/mp4"></video>
</div>
<div id="glow" class="absolute w-[300px] h-[300px] bg-amber-500/30 blur-[60px] rounded-full -z-10 transition-all duration-700"></div>
</div>
<div id="status" class="mt-14 text-[11px] tracking-[0.6em] text-amber-200/80">STANDING BY</div>
<button id="talkBtn" class="mt-6 px-10 py-3.5 bg-amber-500/10 border border-amber-400/30 rounded-full text-[11px] tracking-[0.3em]">FALAR COM SCULPTRON</button>
<div id="chat" class="mt-5 w-[92%] max-w-xl max-h-28 overflow-y-auto space-y-2 hidden text-xs"></div>
<div class="mt-4 flex gap-2 w-[92%] max-w-xl"><input id="textInput" placeholder="Digitar..." class="flex-1 bg-black/60 border border-white/10 rounded-full px-5 py-3 text-xs outline-none"><button onclick="sendText()" class="bg-amber-500/20 border border-amber-400/30 px-5 rounded-full text-xs">Enviar</button></div>
</div>
<script>
let rec,listening=false,speaking=false,animInt; const orb=document.getElementById('orb'),glow=document.getElementById('glow'),video=document.getElementById('coreVideo'),st=document.getElementById('status'),chat=document.getElementById('chat'),btn=document.getElementById('talkBtn');
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){rec=new SR(); rec.lang='pt-BR'; rec.onstart=()=>{listening=true; st.textContent='OUVINDO...'; video.playbackRate=1.6; glow.style.transform='scale(1.4)'}; rec.onend=()=>{listening=false; st.textContent='STANDING BY'; video.playbackRate=1; glow.style.transform='scale(1)'}; rec.onresult=e=>{let t=e.results[0][0].transcript; addMsg('Você: '+t); reply(t);};}
btn.onclick=()=>{if(!rec)return alert('Use Chrome'); listening?rec.stop():rec.start();};
function addMsg(m){chat.classList.remove('hidden'); chat.innerHTML+=`<div class='p-2.5 bg-white/[0.04] border border-white/5 rounded-lg'>${m}</div>`;}
function reply(t){let r=`Entendido Sir! ${t}`; addMsg('SculPtron: '+r); speechSynthesis.cancel(); let u=new SpeechSynthesisUtterance(r); u.lang='pt-BR'; u.onstart=()=>{speaking=true; st.textContent='FALANDO...'; video.playbackRate=2.3; animInt=setInterval(()=>{if(!speaking)return; let s=1.1+Math.random()*0.15; orb.style.transform=`scale(${s})`;},300);}; u.onend=()=>{speaking=false; clearInterval(animInt); orb.style.transform='scale(1)'; video.playbackRate=1; st.textContent='STANDING BY';}; speechSynthesis.speak(u);}
function sendText(){let i=document.getElementById('textInput'); if(!i.value)return; let v=i.value; i.value=''; addMsg('Você: '+v); reply(v);}
</script>
</body>
  </html>
