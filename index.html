<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fire Mix - Video + Code</title>
<style>
  body { margin:0; background:#4a0404; overflow:hidden; display:grid; place-items:center; height:100vh; }
  .container { position:relative; width:100vmin; height:100vmin; }
  video, canvas { position:absolute; top:0; left:0; width:100%; height:100%; border-radius:50%; }
  video { object-fit:cover; filter: contrast(1.3) brightness(1.1) saturate(1.2); }
  canvas { mix-blend-mode: screen; } /* MISTURA o código com o vídeo */
  .glow { position:absolute; inset:-10%; background: radial-gradient(circle, rgba(255,100,0,0.3) 0%, transparent 70%); pointer-events:none; }
</style>
</head>
<body>
<div class="container">
  <video id="vid" autoplay loop muted playsinline>
    <source src="video.mp4" type="video/mp4">
  </video>
  <canvas id="c" width="800" height="800"></canvas>
  <div class="glow"></div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W=800,H=800,CX=W/2,CY=H/2;

function draw(time){
  ctx.clearRect(0,0,W,H);
  const t = time * 0.001;

  // Código que aumenta o vídeo
  for(let l=0; l<3; l++){
    ctx.beginPath();
    const baseR = 210 + l*15 + Math.sin(t*1.2)*8;
    const waves = 10 + l;
    const amp = 30;
    for(let a=0; a<=Math.PI*2+0.01; a+=0.02){
      const wobble = Math.sin(a*waves + t*3 + l) * amp;
      const r = baseR + wobble;
      const x = CX + Math.cos(a)*r;
      const y = CY + Math.sin(a)*r;
      if(a===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.strokeStyle = `hsla(${25+l*5}, 100%, 65%, 0.6)`;
    ctx.lineWidth = 3;
    ctx.shadowBlur = 30;
    ctx.shadowColor = '#ff6600';
    ctx.stroke();
  }
  
  // partículas extras por código
  ctx.shadowBlur = 0;
  for(let i=0;i<60;i++){
    const ang = Math.random()*Math.PI*2;
    const r = 230 + Math.random()*80;
    const x = CX + Math.cos(ang)*r;
    const y = CY + Math.sin(ang)*r;
    ctx.fillStyle = `rgba(255,200,50,${Math.random()})`;
    ctx.beginPath();
    ctx.arc(x,y, Math.random()*2, 0, Math.PI*2);
    ctx.fill();
  }

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
