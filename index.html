<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SculPtron</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Orbitron',monospace;background:#030308;overflow:hidden;margin:0}
.grid{background-image:linear-gradient(rgba(255,159,28,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,159,28,.05) 1px,transparent 1px);background-size:50px 50px}
@keyframes spin{to{transform:rotate(360deg)}} @keyframes spinR{to{transform:rotate(-360deg)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.sphere{animation:breathe 6s ease-in-out infinite;transition:transform.4s ease;overflow:hidden}
.ring1{animation:spin 25s linear infinite}.ring2{animation:spinR 35s linear infinite}.ring3{animation:spin 50s linear infinite}
.listening{transform:scale(1.12)!important}.speaking{transform:scale(1.18)!important; filter:brightness(1.4) saturate(1.3)}
video{width:100%;height:100%;object-fit:cover; border-radius:50%}
</style>
</head>
<body class="text-white h-screen flex flex-col grid">
<div class="flex justify-between p-5 text-[10px] tracking-[0.5em]"><div class="text-amber-200">SCULPTRON · GOLD SYSTEM</div><div class="text-emerald-400 flex gap-2 items-center"><span class="w-2 h-2 bg-emerald-400 rounded-full animate-pulse"></span>ONLINE</div></div>
<div class="flex-1 flex flex-col items-center justify-center">
<div class="relative w-[300px] h-[300px] flex items-center justify-center">
<div class="ring1 absolute w-[360px] h-[360px] rounded-full border border-amber-400/20"></div>
<div class="ring2 absolute w-[420px] h-[420px] rounded-full border border-cyan-300/15"></div>
<div class="ring3 absolute w-[500px] h-[500px] rounded-full border border-dashed border-amber-400/10"></div>

<!-- BOLA COM VIDEO DENTRO SIR -->
<div id="orb" class="sphere w-[220px] h-[220px] rounded-full relative bg-black border border-amber-500/30 shadow-[0_0_80px_#ff9f1c60]">
<video id="coreVideo" autoplay loop muted playsinline>
<source src="core.mp4" type="video/mp4">
</video>
<div class="absolute inset-0 rounded-full pointer-events-none" style="background:radial-gradient(circle at 30% 30%, transparent 40%, rgba(0,0,0,0.4) 80%)"></div>
</div>
<div id="glow" class="absolute w-[280px] h-[280px] bg-amber-500/30 blur-[60px] rounded-full -z-10 transition-all duration-700"></div>
</div>
<div id="status" class="mt-16 text-[11px] tracking-[0.6em] text-amber-200/80">STANDING BY</div>
<button id="talkBtn" class="mt-6 px-10 py-3.5 bg-amber-500/10 border border-amber-400/30 rounded-full text-[11px] tracking-[0.3em] backdrop-blur hover:bg-amber-400/20 transition">FALAR COM SCULPTRON</button>
<div id="chat" class="mt-5 w-[92%] max-w-xl max-h-32 overflow-y-auto space-y-2 hidden text-xs"></div>
<div class="mt-4 flex gap-2 w-[92%] max-w-xl"><input id="textInput" placeholder="Falar ou digitar..." class="flex-1 bg-black/60 border border-white/10 rounded-full px-5 py-3 text-xs outline-none focus:border-amber-400/40"><button onclick="sendText()" class="bg-amber-500/20 border border-amber-400/30 px-5 rounded-full text-xs">Enviar</button></div>
</div>
<script>
let rec,listening=false,speaking=false,speakInterval; const orb=document.getElementById('orb'),glow=document.getElementById('glow'),video=document.getElementById('coreVideo'),st=document.getElementById('status'),chat=document.getElementById('chat'),btn=document.getElementById('talkBtn');
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){rec=new SR(); rec.lang='pt-BR';
rec.onstart=()=>{listening=true; orb.classList.add('listening'); st.textContent='OUVINDO...'; video.playbackRate=1.5; glow.style.transform='scale(1.3)'; glow.style.background='rgba(255,159,28,0.5)'};
rec.onend=()=>{listening=false; orb.classList.remove('listening'); st.textContent='STANDING BY'; video.playbackRate=1; glow.style.transform='scale(1)'; glow.style.background='rgba(245,158,11,0.3)'};
rec.onresult=e=>{let t=e.results[0][0].transcript; addMsg('Você: '+t); reply(t);};
}
btn.onclick=()=>{if(!rec)return alert('Use Chrome Sir'); listening?rec.stop():rec.start();};
function addMsg(m){chat.classList.remove('hidden'); chat.innerHTML+=`<div class='p-2.5 bg-white/[0.04] border border-white/5 rounded-lg'>${m}</div>`; chat.scrollTop=chat.scrollHeight}
function reply(t){
 let r=`Entendido Sir! "${t}" - núcleo dourado 100% operacional!`; addMsg('SculPtron: '+r); speechSynthesis.cancel();
 let u=new SpeechSynthesisUtterance(r); u.lang='pt-BR'; u.rate=0.95;
 u.onstart=()=>{speaking=true; orb.classList.add('speaking'); st.textContent='FALANDO...'; video.playbackRate=2.2;
   speakInterval=setInterval(()=>{if(!speaking)return; let s=1.12+Math.random()*0.15; orb.style.transform=`scale(${s})`; glow.style.transform=`scale(${s*1.2})`;},300);
 };
 u.onend=()=>{speaking=false; clearInterval(speakInterval); orb.classList.remove('speaking'); orb.style.transform='scale(1)'; glow.style.transform='scale(1)'; video.playbackRate=1; st.textContent='STANDING BY';};
 speechSynthesis.speak(u);
}
function sendText(){let i=document.getElementById('textInput'); if(!i.value)return; let v=i.value; i.value=''; addMsg('Você: '+v); reply(v);}
</script>
</body>
</html>
