<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SculPtron</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#ffffff;
    height:100vh;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:sans-serif;
  }
  #wrap{
    position:relative;
    width:600px;
    height:600px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #waveCanvas{
    position:absolute;
    width:600px;
    height:600px;
    left:0; top:0;
  }
  #core{
    position:relative;
    width:140px;
    height:140px;
    background:radial-gradient(circle at 30% 30%, #fff8c4, #facc15, #eab308, #a16207);
    border-radius:50%;
    box-shadow: 0 0 40px rgba(250,204,21,0.8), 0 0 80px rgba(250,204,21,0.4);
    z-index:2;
  }
  #title{
    position:absolute;
    bottom:40px;
    width:100%;
    text-align:center;
    color:#000;
    font-size:14px;
    letter-spacing:4px;
  }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="waveCanvas"></canvas>
    <div id="core"></div>
  </div>
  <div id="title">SCULPTRON</div>

<script>
const canvas = document.getElementById('waveCanvas');
const ctx = canvas.getContext('2d');
canvas.width = 1200;
canvas.height = 1200;
let t = 0;

function draw(){
  t += 0.008; // velocidade lenta e suave
  ctx.clearRect(0,0,1200,1200);
  const cx=600, cy=600;
  const baseR=180;

  for(let r=0; r<3; r++){
    ctx.beginPath();
    for(let i=0; i<=500; i++){
      const ang = (i/500) * Math.PI * 2;
      // movimento infinito orgânico
      const w1 = Math.sin(ang*3 + t + r) * 22;
      const w2 = Math.cos(ang*5 - t*0.7 + r) * 18;
      const w3 = Math.sin(ang*7 + t*0.5 + r*0.3) * 12;
      const w4 = Math.cos(ang*2 + t*0.3) * 10;
      const rad = baseR + r*32 + w1 + w2 + w3 + w4;
      const x = cx + Math.cos(ang) * rad;
      const y = cy + Math.sin(ang) * rad;
      if(i===0) ctx.moveTo(x,y);
      else ctx.lineTo(x,y);
    }
    ctx.closePath();
    // COR AMARELA DOURADA
    ctx.strokeStyle = `rgba(234,179,8,${0.6 - r*0.12})`;
    ctx.lineWidth = 1.5;
    ctx.shadowBlur = 12;
    ctx.shadowColor = '#eab308';
    ctx.stroke();

    // particulas douradas
    for(let i=0; i<500; i+=18){
      const ang = (i/500) * Math.PI * 2;
      const w1 = Math.sin(ang*3 + t + r) * 22;
      const w2 = Math.cos(ang*5 - t*0.7 + r) * 18;
      const w3 = Math.sin(ang*7 + t*0.5 + r*0.3) * 12;
      const w4 = Math.cos(ang*2 + t*0.3) * 10;
      const rad = baseR + r*32 + w1 + w2 + w3 + w4;
      const x = cx + Math.cos(ang) * rad;
      const y = cy + Math.sin(ang) * rad;
      ctx.beginPath();
      ctx.arc(x,y,1.8,0,Math.PI*2);
      ctx.fillStyle = '#facc15';
      ctx.shadowBlur = 8;
      ctx.fill();
    }
  }
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
