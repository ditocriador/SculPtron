<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SCULPTRON GOLD</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{font-family:'Orbitron',monospace}
body{background:#050500;overflow:hidden;margin:0}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes spinR{to{transform:rotate(-360deg)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.ring1{animation:spin 24s linear infinite}.ring2{animation:spinR 38s linear infinite}.ring3{animation:spin 55s linear infinite}
.orb-wrap{animation:breathe 6s ease-in-out infinite;transition:transform 0.32s cubic-bezier(0.34,1.56,0.64,1)}
#glow{transition:all 0.32s ease-out}
#coreVideo{filter:brightness(1.1) contrast(1.05)}
</style>
</head>
<body class="text-white h-screen flex flex-col">
<div class="flex justify-between p-6 text-[10px] tracking-[0.35em]"><div class="text-amber-200">SCULPTRON · GOLD CORE</div><div class="text-emerald-400">● ONLINE</div></div>
<div class="flex-1 flex flex-col items-center justify-center -mt-6">
<div class="relative w-[420px] h-[420px] flex items-center justify-center">
<div id="glow" class="absolute w-[300px] h-[300px] rounded-full blur-[35px] opacity-60" style="background:radial-gradient(circle, rgba(251,191,36,0.9) 0%, rgba(245,158,11,0.6) 30%, transparent 80%)"></div>
<div class="ring1 absolute w-[460px] h-[460px] rounded-full border border-amber-400/20" style="border-top-color:rgba(251,191,36,.5)"></div>
<div class="ring2 absolute w-[560px] h-[560px] rounded-full border border-dashed border-amber-200/10"></div>
<div id="orbWrap" class="orb-wrap relative w-[270px] h-[270px] rounded-full overflow-hidden border border-amber-400/40 shadow-[0_0_70px_rgba(251,191,36,0.6)] bg-black">
<video id="coreVideo" autoplay loop muted playsinline style="width:100%;height:100%;object-fit:cover;border-radius:50%;transform:scale(1.18)">
<source src="core.mp4" type="video/mp4">
</video>
</div>
</div>
<div id="status" class="mt-10 text-[11px] tracking-[0.55em] text-amber-200/90 font-bold">STANDING BY</div>
<button id="talkBtn" class="mt-6 px-10 py-3.5 bg-amber-500/25 border border-amber-400/40 rounded-full text-[11px] tracking-[0.3em]">FALAR COM SCULPTRON</button>
<div id="chat" class="mt-5 w-[92%] max-w-xl max-h-36 overflow-y-auto space-y-2 hidden text-[12px]"></div>
<div class="mt-4 flex gap-2 w-[92%] max-w-xl pb-4"><input id="textInput" placeholder="Digite aqui Sir..." class="flex-1 bg-white/5 border border-white/10 rounded-full px-5 py-3.5 text-xs outline-none"><button onclick="sendText()" class="bg-amber-500/30 border border-amber-400/40 px-7 rounded-full text-xs">Enviar</button></div>
</div>
<script>
const video=document.getElementById('coreVideo'),orbWrap=document.getElementById('orbWrap'),glow=document.getElementById('glow'),st=document.getElementById('status'),chat=document.getElementById('chat'),btn=document.getElementById('talkBtn');
let speaking=false,animInt; video.loop=true; video.playbackRate=0.88;
function setIdleGlow(){glow.style.transform='scale(1)';glow.style.opacity='0.6';glow.style.filter='blur(35px)'}
function setTalkGlow(i){let s=1.6+i*0.9;glow.style.transform=`scale(${s})`;glow.style.opacity=0.85+i*0.4;glow.style.filter=`blur(${55+i*20}px)`}
setIdleGlow();
let rec;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){rec=new SR();rec.lang='pt-BR';rec.onstart=()=>{st.textContent='OUVINDO...';setTalkGlow(0.3)};rec.onend=()=>{if(!speaking){st.textContent='STANDING BY';setIdleGlow()}};rec.onresult=e=>{let t=e.results[0][0].transcript;addMsg('Você: '+t);reply(t)};}
btn.onclick=()=>{try{rec.start()}catch{rec.stop()}};
function addMsg(m){chat.classList.remove('hidden');chat.innerHTML+=`<div class='p-3 bg-white/[0.06] border border-amber-400/10 rounded-xl'>${m}</div>`;chat.scrollTop=chat.scrollHeight}
function reply(tt){let r=`Entendido Sir! "${tt}" - núcleo dourado operacional!`;addMsg('SculPtron: '+r);speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(r);u.lang='pt-BR';u.rate=0.9;u.onstart=()=>{speaking=true;st.textContent='FALANDO...';video.playbackRate=1.2;animInt=setInterval(()=>{if(!speaking)return;let inten=0.4+Math.random()*0.9;orbWrap.style.transform=`scale(${1.08+Math.random()*0.16})`;setTalkGlow(inten)},320)};u.onend=()=>{speaking=false;clearInterval(animInt);orbWrap.style.transform='scale(1)';setIdleGlow();video.playbackRate=0.88;st.textContent='STANDING BY'};speechSynthesis.speak(u);}
function sendText(){let i=document.getElementById('textInput');if(!i.value.trim())return;let v=i.value;i.value='';addMsg('Você: '+v);reply(v);}
document.getElementById('textInput').addEventListener('keypress',e=>{if(e.key==='Enter')sendText()});
</script>
</body>
</html>
