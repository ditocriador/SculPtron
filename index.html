<!-- COLA ISSO DENTRO DO SEU <div class="orb-wrap"> -->

<!-- 1. ONDA ATRÁS DE TUDO (z-index:1) -->
<canvas id="waveBack" style="position:absolute; width:600px; height:600px; left:50%; top:50%; transform:translate(-50%,-50%); z-index:1;"></canvas>

<!-- 2. BRILHO (z-index:2) -->
<div id="glow" style="position:absolute; width:400px; height:400px; left:50%; top:50%; transform:translate(-50%,-50%); background:radial-gradient(circle, rgba(251,191,36,0.35), transparent 70%); filter:blur(25px); z-index:2; border-radius:50%"></div>

<!-- 3. SUA BOLA DOURADA (z-index:3) -->
<video id="core" autoplay loop muted playsinline style="position:absolute; width:280px; height:280px; left:50%; top:50%; transform:translate(-50%,-50%); border-radius:50%; object-fit:cover; z-index:3; box-shadow:0 0 60px rgba(251,191,36,0.6)"></video>

<script>
// VIDEO CORE
document.getElementById('core').src = 'core.mp4';

// ONDA INFINITA ATRÁS
const c = document.getElementById('waveBack');
const ctx = c.getContext('2d');
c.width = c.height = 1200;
let t = 0;
function draw(){
 t+=0.012;
 ctx.clearRect(0,0,1200,1200);
 const cx=600, cy=600, base=220;
 for(let r=0;r<4;r++){
  ctx.beginPath();
  for(let i=0;i<=400;i++){
   let a = i/400 * Math.PI*2;
   let wave = Math.sin(a*3 + t*1.2 + r)*20 + Math.cos(a*5 - t*0.9)*15 + Math.sin(a*7 + t*0.6 + r)*10;
   let rad = base + r*28 + wave;
   let x = cx + Math.cos(a)*rad;
   let y = cy + Math.sin(a)*rad;
   if(i==0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath();
  ctx.strokeStyle = `rgba(251,191,36,${0.55 - r*0.1})`;
  ctx.shadowBlur = 20;
  ctx.shadowColor = '#fbbf24';
  ctx.lineWidth = 1.4;
  ctx.stroke();
 }
 requestAnimationFrame(draw);
}
draw();
</script>
