<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UTRON - Interface IA</title>
  <style>
    :root {
      --bg-color: #03070d;
      --primary-color: #ff9900;
      --primary-glow: rgba(255, 153, 0, 0.4);
      --active-color: #00ffcc;
      --active-glow: rgba(0, 255, 204, 0.6);
      --panel-bg: rgba(10, 20, 30, 0.75);
      --panel-border: rgba(255, 153, 0, 0.3);
      --text-color: #e0e6ed;
      --dim-text: #8a99ad;
      --font-family: 'Courier New', Courier, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      position: relative;
      overflow-x: hidden;
    }

    /* Grid de Fundo */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at center, transparent 30%, var(--bg-color) 90%),
        linear-gradient(rgba(255, 153, 0, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 153, 0, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
      z-index: 1;
      pointer-events: none;
    }

    /* Overlay de Inicialização Automatizada */
    #start-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(3, 7, 13, 0.95);
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    .start-btn {
      background: var(--primary-color);
      color: #000;
      border: none;
      padding: 16px 32px;
      font-size: 1.1rem;
      font-weight: bold;
      font-family: var(--font-family);
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 25px var(--primary-glow);
      letter-spacing: 2px;
      transition: all 0.3s ease;
    }

    .start-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 35px var(--primary-color);
    }

    /* Header / Relógio */
    header {
      z-index: 2;
      width: 100%;
      max-width: 450px;
      text-align: center;
      margin-bottom: 10px;
    }

    .clock-container {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      padding: 10px;
      border-radius: 6px;
      backdrop-filter: blur(5px);
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
    }

    .time {
      font-size: 2.2rem;
      font-weight: bold;
      color: var(--primary-color);
      text-shadow: 0 0 10px var(--primary-glow);
    }

    .date {
      font-size: 0.75rem;
      color: var(--dim-text);
      letter-spacing: 2px;
    }

    /* Área Central: Orbe UTRON Livre no Fundo */
    main {
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 20px 0;
      position: relative;
    }

    .ai-orb-wrapper {
      position: relative;
      width: 250px;
      height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ring {
      position: absolute;
      border-radius: 50%;
      border: 2px solid transparent;
      transition: all 0.5s ease;
    }

    .ring-outer {
      width: 100%;
      height: 100%;
      border-top-color: var(--primary-color);
      border-bottom-color: var(--primary-color);
      animation: spin 8s linear infinite;
    }

    .ring-middle {
      width: 80%;
      height: 80%;
      border-left-color: var(--primary-color);
      border-right-color: var(--primary-color);
      animation: spin-reverse 6s linear infinite;
    }

    .orb-core {
      width: 60%;
      height: 60%;
      border-radius: 50%;
      background: radial-gradient(circle, #ffe600 0%, #ff5500 60%, transparent 100%);
      box-shadow: 0 0 40px #ff5500, 0 0 80px var(--primary-glow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: pulse 2.5s ease-in-out infinite;
      transition: all 0.5s ease;
    }

    .orb-title {
      font-size: 1.4rem;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 0 0 8px #000000;
      letter-spacing: 3px;
    }

    .orb-subtitle {
      font-size: 0.6rem;
      color: #000000;
      background: var(--primary-color);
      padding: 2px 6px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-top: 4px;
      border-radius: 2px;
      transition: background 0.5s ease;
    }

    /* Estado Ativo do Orbe quando Ouve ou Fala */
    .listening .ring-outer, .speaking .ring-outer {
      border-top-color: var(--active-color);
      border-bottom-color: var(--active-color);
      animation-duration: 3s;
    }

    .listening .ring-middle, .speaking .ring-middle {
      border-left-color: var(--active-color);
      border-right-color: var(--active-color);
      animation-duration: 2s;
    }

    .listening .orb-core, .speaking .orb-core {
      background: radial-gradient(circle, #ffffff 0%, var(--active-color) 60%, transparent 100%);
      box-shadow: 0 0 40px var(--active-color), 0 0 80px var(--active-glow);
      animation: pulse 0.8s ease-in-out infinite;
    }

    .listening .orb-subtitle, .speaking .orb-subtitle {
      background: var(--active-color);
    }

    /* Botão e Controles */
    .controls-container {
      z-index: 3;
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .mic-button {
      background: var(--panel-bg);
      border: 2px solid var(--primary-color);
      color: var(--primary-color);
      padding: 12px 24px;
      border-radius: 30px;
      font-family: var(--font-family);
      font-size: 0.9rem;
      font-weight: bold;
      letter-spacing: 1.5px;
      cursor: pointer;
      box-shadow: 0 0 10px var(--primary-glow);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
    }

    .mic-button.active {
      border-color: var(--active-color);
      color: var(--active-color);
      box-shadow: 0 0 20px var(--active-glow);
    }

    /* Painéis Inferiores */
    .hud-container {
      z-index: 2;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      width: 100%;
      max-width: 600px;
      justify-content: center;
    }

    .hud-panel {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      padding: 12px;
      border-radius: 6px;
      backdrop-filter: blur(5px);
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
      flex: 1 1 250px;
    }

    .panel-title {
      color: var(--primary-color);
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 4px;
      margin-bottom: 8px;
    }

    .log-list {
      list-style: none;
      font-size: 0.7rem;
      color: var(--dim-text);
      line-height: 1.5;
    }

    .log-list li::before {
      content: "> ";
      color: var(--primary-color);
    }

    .metric {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 0.7rem;
    }

    .metric-bar {
      width: 70px;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
    }

    .metric-fill {
      height: 100%;
      background: var(--primary-color);
    }

    /* Rodapé */
    footer {
      z-index: 2;
      width: 100%;
      max-width: 600px;
      border-top: 1px solid var(--panel-border);
      padding-top: 8px;
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      font-size: 0.65rem;
      color: var(--dim-text);
    }

    .status-online {
      color: #00ff66;
    }

    /* Keyframes Animação */
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes spin-reverse {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(0.95); opacity: 0.85; }
      50% { transform: scale(1.05); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Overlay para liberação de permissão de Áudio -->
  <div id="start-overlay">
    <h2 style="color: var(--primary-color); letter-spacing: 3px;">SISTEMA UTRON</h2>
    <p style="color: var(--dim-text); font-size: 0.8rem;">Clique abaixo para inicializar os módulos de voz</p>
    <button class="start-btn" id="start-app-btn">INICIAR UTRON</button>
  </div>

  <!-- Relógio -->
  <header>
    <div class="clock-container">
      <div class="time" id="clock">00:00:00</div>
      <div class="date" id="date">CARREGANDO...</div>
    </div>
  </header>

  <!-- Orbe UTRON Principal -->
  <main>
    <div class="ai-orb-wrapper" id="orb-wrapper">
      <div class="ring ring-outer"></div>
      <div class="ring ring-middle"></div>
      <div class="orb-core">
        <span class="orb-title">UTRON</span>
        <span class="orb-subtitle" id="orb-status">STANDBY</span>
      </div>
    </div>
  </main>

  <!-- Controle de Voz -->
  <div class="controls-container">
    <button class="mic-button" id="mic-btn">
      <span id="mic-icon">🎙️</span>
      <span id="mic-label">ÁUDIO CONECTADO</span>
    </button>
  </div>

  <!-- Painéis HUD Inferiores -->
  <div class="hud-container">
    <div class="hud-panel">
      <div class="panel-title">Atividade de Voz</div>
      <ul class="log-list" id="activity-log">
        <li>Sistema UTRON carregado.</li>
        <li>Aguardando inicialização...</li>
      </ul>
    </div>

    <div class="hud-panel">
      <div class="panel-title">Recursos UTRON</div>
      <div class="metric">
        <span>CPU CORE</span>
        <div class="metric-bar"><div class="metric-fill" style="width: 32%;"></div></div>
      </div>
      <div class="metric">
        <span>MEMÓRIA RAM</span>
        <div class="metric-bar"><div class="metric-fill" style="width: 48%;"></div></div>
      </div>
      <div class="metric">
        <span>VOZ GOOGLE</span>
        <div class="metric-bar"><div class="metric-fill" style="width: 100%; background: #00ffcc;"></div></div>
      </div>
    </div>
  </div>

  <!-- Rodapé -->
  <footer>
    <span>SISTEMA: <span class="status-online">ATIVO</span></span>
    <span>SISTEMA UTRON v3.0</span>
  </footer>

  <script>
    // Relógio Digital
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      
      const options = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
      
      document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
      document.getElementById('date').textContent = now.toLocaleDateString('pt-BR', options).toUpperCase();
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Elementos da Interface
    const startOverlay = document.getElementById('start-overlay');
    const startAppBtn = document.getElementById('start-app-btn');
    const micBtn = document.getElementById('mic-btn');
    const micLabel = document.getElementById('mic-label');
    const orbWrapper = document.getElementById('orb-wrapper');
    const orbStatus = document.getElementById('orb-status');
    const activityLog = document.getElementById('activity-log');

    // Módulo de Voz (Sintetizador e Reconhecimento)
    const synth = window.speechSynthesis;
    let googleVoice = null;
    let recognition = null;
    let isListening = false;

    // Carregar Voz do Google em Português
    function loadGoogleVoice() {
      const voices = synth.getVoices();
      googleVoice = voices.find(v => v.lang.includes('pt') && v.name.includes('Google')) 
                 || voices.find(v => v.lang.includes('pt-BR')) 
                 || voices.find(v => v.lang.includes('pt'));
    }

    if (synth.onvoiceschanged !== undefined) {
      synth.onvoiceschanged = loadGoogleVoice;
    }
    loadGoogleVoice();

    // UTRON Falando
    function speak(text) {
      if (synth.speaking) synth.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      if (googleVoice) {
        utterance.voice = googleVoice;
      }
      utterance.lang = 'pt-BR';
      utterance.rate = 1.0;

      utterance.onstart = () => {
        orbWrapper.classList.remove('listening');
        orbWrapper.classList.add('speaking');
        orbStatus.textContent = "FALANDO";
      };

      utterance.onend = () => {
        orbWrapper.classList.remove('speaking');
        startListening(); // Reativa a escuta automática após responder
      };

      synth.speak(utterance);
    }

    // Configurar Reconhecimento de Voz Automático
    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        addLog("Navegador não suporta Web Speech API.");
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = 'pt-BR';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isListening = true;
        orbWrapper.classList.add('listening');
        orbStatus.textContent = "OUVINDO";
        micBtn.classList.add('active');
        micLabel.textContent = "OUVINDO...";
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        addLog(`Você: "${transcript}"`);
        processCommand(transcript);
      };

      recognition.onerror = (event) => {
        addLog(`Erro áudio: ${event.error}`);
        orbWrapper.classList.remove('listening');
        orbStatus.textContent = "ONLINE";
      };

      recognition.onend = () => {
        isListening = false;
        if (!synth.speaking) {
          orbWrapper.classList.remove('listening');
          orbStatus.textContent = "ONLINE";
          micBtn.classList.remove('active');
          micLabel.textContent = "CONVERSAR COM UTRON";
        }
      };

      startListening();
    }

    function startListening() {
      if (recognition && !isListening && !synth.speaking) {
        try {
          recognition.start();
        } catch (e) {
          // Já iniciado
        }
      }
    }

    // Processador de Comandos Simples
    function processCommand(text) {
      const lower = text.toLowerCase();
      
      if (lower.includes('olá') || lower.includes('oi')) {
        speak("Olá! Como posso ajudar você hoje?");
      } else if (lower.includes('seu nome') || lower.includes('quem é você')) {
        speak("Eu sou o Utron, sua inteligência artificial.");
      } else if (lower.includes('horas')) {
        const now = new Date();
        speak(`Agora são ${now.getHours()} horas e ${now.getMinutes()} minutos.`);
      } else {
        speak(`Entendi. Você disse: ${text}`);
      }
    }

    function addLog(text) {
      if (activityLog.children.length >= 3) {
        activityLog.removeChild(activityLog.children[0]);
      }
      const newLi = document.createElement('li');
      newLi.textContent = text;
      activityLog.appendChild(newLi);
    }

    // Evento de Inicialização
    startAppBtn.addEventListener('click', () => {
      startOverlay.style.display = 'none';
      addLog("Sistema UTRON inicializado.");
      
      // Ativa e cumprimenta
      initSpeechRecognition();
      speak("Sistema UTRON ativado. Como posso ajudar?");
    });

    // Botão Manual de Falar
    micBtn.addEventListener('click', () => {
      if (isListening) {
        if (recognition) recognition.stop();
      } else {
        startListening();
      }
    });
  </script>
</body>
</html>
