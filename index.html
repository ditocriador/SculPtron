<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS / UPRON - Interface IA</title>
  <style>
    :root {
      --bg-color: #03070d;
      --primary-color: #ff9900;
      --primary-glow: rgba(255, 153, 0, 0.4);
      --panel-bg: rgba(10, 20, 30, 0.65);
      --panel-border: rgba(255, 153, 0, 0.3);
      --text-color: #e0e6ed;
      --dim-text: #8a99ad;
      --font-family: 'Courier New', Courier, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-family);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
      position: relative;
    }

    /* Efeito de grade de fundo */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at center, transparent 30%, var(--bg-color) 90%),
        linear-gradient(rgba(255, 153, 0, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 153, 0, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
      z-index: 1;
      pointer-events: none;
    }

    /* Painéis Genéricos */
    .hud-panel {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      padding: 15px;
      border-radius: 4px;
      backdrop-filter: blur(5px);
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
      z-index: 2;
    }

    .panel-title {
      color: var(--primary-color);
      font-size: 0.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 5px;
      margin-bottom: 10px;
    }

    /* Cabeçalho / Relógio */
    header {
      z-index: 2;
    }

    .clock-container {
      display: inline-block;
    }

    .time {
      font-size: 2.5rem;
      font-weight: bold;
      color: var(--primary-color);
      text-shadow: 0 0 10px var(--primary-glow);
    }

    .date {
      font-size: 0.8rem;
      color: var(--dim-text);
      letter-spacing: 2px;
    }

    /* Área Central - Orbe da IA */
    main {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .ai-orb-wrapper {
      position: relative;
      width: 260px;
      height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Anéis Rotativos */
    .ring {
      position: absolute;
      border-radius: 50%;
      border: 2px solid transparent;
    }

    .ring-outer {
      width: 100%;
      height: 100%;
      border-top-color: var(--primary-color);
      border-bottom-color: var(--primary-color);
      animation: spin 8s linear infinite;
    }

    .ring-middle {
      width: 80%;
      height: 80%;
      border-left-color: var(--primary-color);
      border-right-color: var(--primary-color);
      animation: spin-reverse 6s linear infinite;
    }

    /* Core Iluminado */
    .orb-core {
      width: 60%;
      height: 60%;
      border-radius: 50%;
      background: radial-gradient(circle, #ffe600 0%, #ff5500 60%, transparent 100%);
      box-shadow: 0 0 40px #ff5500, 0 0 80px var(--primary-glow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: pulse 2.5s ease-in-out infinite;
    }

    .orb-title {
      font-size: 1.4rem;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 0 0 8px #000000;
      letter-spacing: 3px;
    }

    .orb-subtitle {
      font-size: 0.6rem;
      color: #000000;
      background: var(--primary-color);
      padding: 2px 6px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-top: 4px;
    }

    /* Painéis das Laterais */
    .hud-container {
      display: flex;
      justify-content: space-between;
      width: 100%;
      z-index: 2;
    }

    .left-panel, .right-panel {
      width: 250px;
    }

    /* Conteúdo dos Logs */
    .log-list {
      list-style: none;
      font-size: 0.75rem;
      color: var(--dim-text);
      line-height: 1.6;
    }

    .log-list li::before {
      content: "> ";
      color: var(--primary-color);
    }

    /* Métricas do Sistema */
    .metric {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 0.75rem;
    }

    .metric-bar {
      width: 60px;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
    }

    .metric-fill {
      height: 100%;
      background: var(--primary-color);
      width: 50%;
    }

    /* Rodapé */
    footer {
      border-top: 1px solid var(--panel-border);
      padding-top: 8px;
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: var(--dim-text);
      z-index: 2;
    }

    .status-online {
      color: #00ff66;
    }

    /* Animações Keyframes */
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes spin-reverse {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Topo: Relógio -->
  <header>
    <div class="hud-panel clock-container">
      <div class="time" id="clock">00:00:00</div>
      <div class="date" id="date">CARREGANDO...</div>
    </div>
  </header>

  <!-- Centro: Orbe IA -->
  <main>
    <div class="ai-orb-wrapper">
      <div class="ring ring-outer"></div>
      <div class="ring ring-middle"></div>
      <div class="orb-core">
        <span class="orb-title">JARVIS</span>
        <span class="orb-subtitle">ONLINE</span>
      </div>
    </div>
  </main>

  <!-- Laterais: Logs e Métricas -->
  <div class="hud-container">
    <div class="hud-panel left-panel">
      <div class="panel-title">Atividade do Sistema</div>
      <ul class="log-list" id="activity-log">
        <li>Inicializando núcleo...</li>
        <li>Conexão de rede OK.</li>
        <li>Aguardando comando de voz.</li>
      </ul>
    </div>

    <div class="hud-panel right-panel">
      <div class="panel-title">Análise de Recursos</div>
      <div class="metric">
        <span>CPU CORE</span>
        <div class="metric-bar"><div class="metric-fill" style="width: 28%;"></div></div>
      </div>
      <div class="metric">
        <span>MEMÓRIA RAM</span>
        <div class="metric-bar"><div class="metric-fill" style="width: 54%;"></div></div>
      </div>
      <div class="metric">
        <span>REDE LATÊNCIA</span>
        <div class="metric-bar"><div class="metric-fill" style="width: 15%;"></div></div>
      </div>
    </div>
  </div>

  <!-- Rodapé -->
  <footer>
    <span>SISTEMA: <span class="status-online">ATIVO</span></span>
    <span>SISTEMA DE VOZ: PRONTO</span>
  </footer>

  <script>
    // Atualização do Relógio
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      
      const options = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
      
      document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
      document.getElementById('date').textContent = now.toLocaleDateString('pt-BR', options).toUpperCase();
    }

    setInterval(updateClock, 1000);
    updateClock();

    // Simulação de Logs dinâmicos
    const logs = [
      "Escaneando frequências...",
      "Sincronizando banco de dados.",
      "Análise de voz calibrada.",
      "Verificando integridade..."
    ];

    setInterval(() => {
      const logList = document.getElementById('activity-log');
      const randomLog = logs[Math.floor(Math.random() * logs.length)];
      
      if (logList.children.length >= 4) {
        logList.removeChild(logList.children[0]);
      }
      
      const newLi = document.createElement('li');
      newLi.textContent = randomLog;
      logList.appendChild(newLi);
    }, 4000);
  </script>
</body>
</html>
