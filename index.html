<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SculPtron Gold</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet"><style>body{font-family:'Orbitron',monospace;background:#050508;overflow:hidden}.grid-bg{background-image:linear-gradient(rgba(0,212,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,.03) 1px,transparent 1px);background-size:40px 40px}@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}@keyframes spinR{from{transform:rotate(360deg)}to{transform:rotate(0)}}@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}@keyframes glow{0%,100%{box-shadow:0 0 60px #FF9F1C,0 0 100px #FF9F1C40}50%{box-shadow:0 0 100px #FF9F1C,0 0 160px #FF9F1C80}}.orb{animation:breathe 3s ease-in-out infinite,glow 2s infinite}.ring1{animation:spin 8s linear infinite;border:1px solid rgba(255,159,28,.3)}.ring2{animation:spinR 12s linear infinite;border:1px solid rgba(0,212,255,.3)}.ring3{animation:spin 20s linear infinite;border:1px dashed rgba(255,159,28,.2)}</style></head><body class="text-white h-screen flex flex-col grid-bg"><div class="flex justify-between p-4 text-[10px] tracking-[0.3em] text-cyan-400/70"><div>JARVIS • SCULPTRON GOLD</div><div class="text-green-400">● SYSTEM ONLINE</div></div><div class="flex-1 flex flex-col items-center justify-center"><div class="relative w-[280px] h-[280px] flex items-center justify-center"><div class="ring1 absolute w-[320px] h-[320px] rounded-full"></div><div class="ring2 absolute w-[380px] h-[380px] rounded-full"></div><div class="ring3 absolute w-[440px] h-[440px] rounded-full"></div><div id="orb" class="orb w-[200px] h-[200px] rounded-full" style="background:radial-gradient(circle at 30% 30%,#FFD27A,#FF9F1C 40%,#FF6A00 70%,#8B2500)"></div></div><div id="status" class="mt-10 text-xs tracking-[0.4em] text-amber-300">STANDING BY</div><button id="talkBtn" class="mt-6 px-8 py-3 border border-amber-400/50 bg-amber-500/10 rounded-full text-[11px] tracking-widest">FALAR COM SCULPTRON</button><div id="chat" class="mt-6 w-full max-w-xl max-h-24 overflow-y-auto text-[11px] px-6 space-y-2 hidden"></div><div class="mt-4 flex gap-2 w-full max-w-xl px-6"><input id="textInput" placeholder="Falar ou digitar..." class="flex-1 bg-black/50 border border-cyan-500/20 rounded-full px-4 py-2 text-xs outline-none"><button onclick="sendText()" class="bg-cyan-500/20 border border-cyan-400/50 px-4 rounded-full text-xs">Enviar</button></div></div><div class="grid grid-cols-4 gap-3 p-4 max-w-4xl mx-auto w-full"><div class="border border-cyan-500/20 bg-black/40 p-3 rounded"><div class="text-[9px] text-cyan-400">CONVERSA</div><div class="text-[10px] text-zinc-500">Falar ou digitar</div></div><div class="border border-amber-500/20 bg-black/40 p-3 rounded"><div class="text-[9px] text-amber-400">MEMÓRIA</div><div class="text-[10px] text-zinc-500">O que eu lembro</div></div><div class="border border-cyan-500/20 bg-black/40 p-3 rounded"><div class="text-[9px] text-cyan-400">PROJETOS</div><div class="text-[10px] text-zinc-500">Tarefas</div></div><div class="border border-amber-500/20 bg-black/40 p-3 rounded"><div class="text-[9px] text-amber-400">HISTÓRICO</div><div class="text-[10px] text-zinc-500">Conversas</div></div></div><script>let rec,listen=false,synth=speechSynthesis;const orb=document.getElementById('orb'),st=document.getElementById('status'),chat=document.getElementById('chat'),btn=document.getElementById('talkBtn');const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){rec=new SR();rec.lang='pt-BR';rec.onstart=()=>{listen=true;st.textContent='OUVINDO...';orb.style.transform='scale(1.15)'};rec.onend=()=>{listen=false;st.textContent='STANDING BY';orb.style.transform='scale(1)'};rec.onresult=e=>{let t=e.results[0][0].transcript;addMsg('Você: '+t);reply(t);}}btn.onclick=()=>listen?rec.stop():rec.start();function addMsg(t){chat.classList.remove('hidden');chat.innerHTML+=`<div class='p-2 bg-white/5 rounded'>${t}</div>`}function reply(t){let r=`Entendido Sir! "${t}" - Sistemas dourados 100%!`;addMsg('SculPtron: '+r);let u=new SpeechSynthesisUtterance(r);u.lang='pt-BR';synth.speak(u);}function sendText(){let i=document.getElementById('textInput');if(!i.value)return;let t=i.value;i.value='';addMsg('Você: '+t);reply(t);}</script></body></html>
